name: Deploy Staging (Coolify)

on:
  push:
    branches:
      - staging
    paths-ignore:
      - release-notes.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger Coolify staging deployment
        id: trigger
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID_STAGING }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering Coolify staging deployment for app ${COOLIFY_APP_UUID}"
          response=$(curl -fsS -X POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=true" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json")
          echo "${response}"
          deployment_uuid=$(echo "${response}" | jq -r '.deployments[0].deployment_uuid')
          if [ -z "${deployment_uuid}" ] || [ "${deployment_uuid}" = "null" ]; then
            echo "::error::Coolify did not return a deployment uuid"
            exit 1
          fi
          echo "deployment_uuid=${deployment_uuid}" >> "${GITHUB_OUTPUT}"

      - name: Wait for Coolify staging deployment
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            status=$(curl -fsS \
              "${COOLIFY_URL}/api/v1/deployments/${DEPLOYMENT_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" | jq -r '.status')
            echo "attempt ${attempt}: ${status}"
            case "${status}" in
              finished)
                echo "::notice::Staging deployment ${DEPLOYMENT_UUID} finished successfully"
                exit 0
                ;;
              failed|cancelled*)
                echo "::error::Staging deployment ${DEPLOYMENT_UUID} ended with status ${status}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for staging deployment ${DEPLOYMENT_UUID}"
          exit 1
