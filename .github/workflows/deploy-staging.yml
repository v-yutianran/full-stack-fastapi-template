name: Deploy Staging (Coolify)

on:
  push:
    branches:
      - staging
    paths-ignore:
      - release-notes.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Trigger Coolify staging deployment
        id: trigger
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID_STAGING }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering Coolify staging deployment for app ${COOLIFY_APP_UUID}"
          response=$(curl -fsS -X POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=true" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json")
          echo "${response}"
          deployment_uuid=$(echo "${response}" | jq -r '.deployments[0].deployment_uuid')
          if [ -z "${deployment_uuid}" ] || [ "${deployment_uuid}" = "null" ]; then
            echo "::error::Coolify did not return a deployment uuid"
            exit 1
          fi
          echo "deployment_uuid=${deployment_uuid}" >> "${GITHUB_OUTPUT}"

      - name: Wait for Coolify staging deployment
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            status=$(curl -fsS \
              "${COOLIFY_URL}/api/v1/deployments/${DEPLOYMENT_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" | jq -r '.status')
            echo "attempt ${attempt}: ${status}"
            case "${status}" in
              finished)
                echo "::notice::Staging deployment ${DEPLOYMENT_UUID} finished successfully"
                exit 0
                ;;
              failed|cancelled*)
                echo "::error::Staging deployment ${DEPLOYMENT_UUID} ended with status ${status}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for staging deployment ${DEPLOYMENT_UUID}"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          set -euo pipefail
          cd smoke
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests against staging
        id: smoke
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ vars.STAGING_URL }}
          PREVIEW_USER: admin@yutianran.cn
          PREVIEW_PASSWORD: ${{ secrets.STAGING_SUPERUSER_PASSWORD }}
        run: |
          set -euo pipefail
          cd smoke
          npx playwright test

      - name: Report staging smoke result
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            {
              echo "### ✅ Staging smoke tests passed"
              echo ""
              echo "- URL: ${{ vars.STAGING_URL }}"
              echo "- Deployment: \`${{ steps.trigger.outputs.deployment_uuid }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ Staging smoke tests failed"
              echo ""
              echo "- URL: ${{ vars.STAGING_URL }}"
              echo "- Deployment: \`${{ steps.trigger.outputs.deployment_uuid }}\`"
              echo "- 查看上方 “Run Playwright smoke tests against staging” 步骤日志"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Staging smoke tests failed"
            exit 1
          fi
