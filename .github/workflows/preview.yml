name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    # Only same-repository branches get secrets and a preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_PREVIEW_PROJECT_UUID: ${{ vars.COOLIFY_PREVIEW_PROJECT_UUID }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      PREVIEW_SECRET_SALT: ${{ secrets.PREVIEW_SECRET_SALT }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      REPO_FULL: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Deploy preview environment
        if: github.event.action != 'closed'
        env:
          ACTION: up
        run: |
          set -euo pipefail
          bash .github/scripts/coolify-preview.sh | tee /tmp/preview.out

      - name: Publish preview URL comment
        if: github.event.action != 'closed'
        id: comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url=$(grep -oP '^PREVIEW_URL=\K.*' /tmp/preview.out | tail -1)
          user=$(grep -oP '^PREVIEW_USER=\K.*' /tmp/preview.out | tail -1)
          pass=$(grep -oP '^PREVIEW_PASSWORD=\K.*' /tmp/preview.out | tail -1)
          body=$(cat <<EOF
          <!-- coolify-preview -->
          ## 🚀 Preview environment

          - Site: ${url}
          - API docs: ${url}/docs
          - Login: \`${user}\` / \`${pass}\`
          - Smoke tests: ⏳ running

          <sub>Updated $(date -u +%Y-%m-%dT%H:%MZ) · commit ${HEAD_SHA:0:7}</sub>
          EOF
          )
          existing=$(gh api "repos/${REPO_FULL}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- coolify-preview -->")) | .id' | head -1 || true)
          if [ -n "${existing}" ]; then
            jq -n --arg b "${body}" '{body:$b}' | gh api -X PATCH "repos/${REPO_FULL}/issues/comments/${existing}" --input - >/dev/null
            comment_id="${existing}"
          else
            response=$(jq -n --arg b "${body}" '{body:$b}' | gh api -X POST "repos/${REPO_FULL}/issues/${PR_NUMBER}/comments" --input -)
            comment_id=$(printf '%s' "${response}" | jq -r '.id')
          fi
          {
            echo "PREVIEW_URL=${url}"
            echo "PREVIEW_USER=${user}"
            echo "PREVIEW_PASSWORD=${pass}"
            echo "COMMENT_ID=${comment_id}"
          } >> "$GITHUB_ENV"
          echo "preview comment ready: ${comment_id}"

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Playwright
        if: github.event.action != 'closed'
        run: |
          set -euo pipefail
          cd smoke
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        if: github.event.action != 'closed'
        id: smoke
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          PREVIEW_USER: ${{ env.PREVIEW_USER }}
          PREVIEW_PASSWORD: ${{ env.PREVIEW_PASSWORD }}
        run: |
          set -euo pipefail
          cd smoke
          npx playwright test

      - name: Publish smoke test result
        if: always() && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            result="✅ passed"
          else
            result="❌ failed (see workflow logs)"
          fi
          body=$(cat <<EOF
          <!-- coolify-preview -->
          ## 🚀 Preview environment

          - Site: ${PREVIEW_URL}
          - API docs: ${PREVIEW_URL}/docs
          - Login: \`${PREVIEW_USER}\` / \`${PREVIEW_PASSWORD}\`
          - Smoke tests: ${result}

          <sub>Updated $(date -u +%Y-%m-%dT%H:%MZ) · commit ${HEAD_SHA:0:7}</sub>
          EOF
          )
          jq -n --arg b "${body}" '{body:$b}' | gh api -X PATCH "repos/${REPO_FULL}/issues/comments/${COMMENT_ID}" --input - >/dev/null
          echo "smoke result: ${result}"
          if [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "::error::Playwright smoke tests failed for the preview environment"
            exit 1
          fi

      - name: Clean up preview environment
        if: github.event.action == 'closed'
        env:
          ACTION: down
        run: |
          set -euo pipefail
          bash .github/scripts/coolify-preview.sh
